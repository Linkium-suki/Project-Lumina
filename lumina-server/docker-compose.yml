services:
  db:
    image: postgres:16-alpine
    container_name: lumina-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina
    ports:
      - "5432:5432"
    volumes:
      - lumina-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/lumina
      DB_USER: lumina
      DB_PASSWORD: lumina
      LUMINA_MASTER_KEY: ${LUMINA_MASTER_KEY:change-me-to-a-32-byte-random-key!!}
      LUMINA_WATCHMAN_ENABLED: ${LUMINA_WATCHMAN_ENABLED:false}
      LUMINA_WATCHMAN_DEEPSEEK_KEY: ${LUMINA_WATCHMAN_DEEPSEEK_KEY:}
      LUMINA_WATCHMAN_QWEN_KEY: ${LUMINA_WATCHMAN_QWEN_KEY:}
      AZURE_TTS_REGION: ${AZURE_TTS_REGION:eastasia}
      AZURE_TTS_KEY: ${AZURE_TTS_KEY:}
      AZURE_TTS_VOICE: ${AZURE_TTS_VOICE:zh-CN-XiaoxiaoNeural}
    ports:
      - "8080:8080"

volumes:
  lumina-db-data:
