server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lumina-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lumina}
    username: ${DB_USER:lumina}
    password: ${DB_PASSWORD:lumina}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ============ Lumina 业务配置 ============
lumina:
  security:
    # 主密钥：用于 AES-256-GCM 加密用户自填的 API Key，只允许来自环境变量/K8s Secret
    master-key: ${LUMINA_MASTER_KEY:change-me-to-a-32-byte-random-key!!}
    token-ttl-days: ${LUMINA_TOKEN_TTL_DAYS:90}
  rate-limit:
    # 简单内存固定窗口限流（每 token 每分钟请求数）
    requests-per-minute: ${LUMINA_RATE_LIMIT_RPM:30}
  pool:
    # 互助模式用户每日可消耗的请求次数上限（防滥用）
    daily-request-limit: ${LUMINA_POOL_DAILY_LIMIT:100}
  watchman:
    # 守夜人兜底：互助池枯竭时使用的作者自持 Key
    enabled: ${LUMINA_WATCHMAN_ENABLED:false}
    keys:
      - provider: deepseek
        api-key: ${LUMINA_WATCHMAN_DEEPSEEK_KEY:}
        model: deepseek-chat
      - provider: qwen
        api-key: ${LUMINA_WATCHMAN_QWEN_KEY:}
        model: qwen-plus

# AI 提供商适配器列表（顺序即故障转移优先级）。
# 各提供商均使用 OpenAI 兼容协议，base-url 指向各自的兼容端点。
lumina-ai:
  providers:
    chat:
      - id: deepseek
        base-url: https://api.deepseek.com/v1
        models:
          - deepseek-chat
          - deepseek-reasoner
      - id: qwen
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        models:
          - qwen-plus
      - id: zhipu
        base-url: https://open.bigmodel.cn/api/paas/v4
        models:
          - glm-4-flash
      - id: gemini
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        models:
          - gemini-2.0-flash
    tts:
      - id: azure
        region: ${AZURE_TTS_REGION:eastasia}
        api-key: ${AZURE_TTS_KEY:}
        voice: ${AZURE_TTS_VOICE:zh-CN-XiaoxiaoNeural}

resilience4j:
  circuitbreaker:
    instances:
      deepseek:
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
      qwen:
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
      zhipu:
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
      gemini:
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
  retry:
    instances:
      chat:
        max-attempts: 2
        wait-duration: 500ms
